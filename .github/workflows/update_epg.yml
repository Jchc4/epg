name: Update Sports EPG

on:
  push:
    branches: [ main ]
    paths:
      - 'merge_epg.py'
      - '.github/workflows/**'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Consolidated Sports EPG
        run: |
          python merge_epg.py epg.xml.gz

      - name: Commit and push EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.xml.gz
          git commit -m "chore(epg): update sports EPG [skip ci]" || echo "No changes"
          git push
